# Ship-provenance manifest for the curated established node library.
#
# The AKMS v2 node frontmatter schema (GlobalNodeFrontmatter) forbids extra
# top-level keys (model_config extra="forbid"), so ship-provenance CANNOT live
# in the node frontmatter. It lives here instead, keyed by the node's `id`.
#
# Contract: every node .md under verified_nodes/ MUST have a matching table
# below whose key equals the node's frontmatter `id`. Required keys per entry:
#   verified_by  — who reviewed/approved the node (human handle or "human-expert")
#   verified_at  — ISO-8601 date (YYYY-MM-DD) of last review/approval
#   version      — content/schema version string (semver or date); bump on
#                  material content changes
#   source_ref   — human-readable citation for the content. NOTE: the node's
#                  own AKMS `source` field is the enum (human/agent/hybrid/
#                  generated); this `source_ref` is the free-text provenance.
#
# P3-2 (sync) and P3-3 (guard) consume the node frontmatter for the ship gate
# (status: established); this manifest travels alongside for provenance/version
# surfacing (P4-2) and promotion stamping (P5-1).
#
# Fixture content is a clearly-labelled placeholder (TBD-3); the provenance
# below is illustrative placeholder metadata for those fixtures.

