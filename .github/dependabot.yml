version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jerusalem"
    cooldown:
      default-days: 7
    groups:
      python-runtime:
        dependency-type: "production"
        patterns:
          - "*"
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:10"
      timezone: "Asia/Jerusalem"
    cooldown:
      default-days: 7
    groups:
      javascript-runtime:
        dependency-type: "production"
        patterns:
          - "*"
      javascript-development:
        dependency-type: "development"
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"
    # Tailwind 4 (CSS-first config, separate PostCSS plugin) and TypeScript 7
    # each need a deliberate migration; keep their majors out of the weekly group.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:20"
      timezone: "Asia/Jerusalem"
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
      timezone: "Asia/Jerusalem"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
