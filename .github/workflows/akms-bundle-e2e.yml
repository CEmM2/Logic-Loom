name: AKMS Bundle E2E

# Runs the AKMS bundle end-to-end test matrix on macOS, Linux, and Windows
# before any release tagging is allowed. Triggers on PRs targeting `master`
# that touch the AKMS bundle surface, plus a manual workflow_dispatch hook for
# release engineers.
#
# The macOS and Windows legs are platform-deferred from local development —
# this workflow is the first place they get exercised. Expect the Windows leg
# to surface PowerShell escaping issues that the local static check on
# scripts/build_sidecar_windows.ps1 cannot catch.

on:
  pull_request:
    branches: [master, main, dev]
    paths:
      - "services/logic_loom_api/**"
      - "apps/desktop/**"
      - "packaging/**"
      - "scripts/build_sidecar_*"
      - "scripts/check_resources_no_vault.py"
      - ".github/workflows/akms-bundle-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resources-guard:
    name: resources/ Nodes_Vault security guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run guard
        run: python3 scripts/check_resources_no_vault.py

  backend-e2e:
    name: Backend E2E (${{ matrix.os }})
    needs: resources-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (with logic-loom-api dev extras for pytest)
        # `uv sync --all-extras` at the workspace root only resolves the
        # root package — workspace MEMBER packages stay un-installed and
        # their optional-dependencies (dev: pytest, pytest-asyncio, httpx)
        # never land. Use `--package logic-loom-api --all-extras` to pull
        # the member's resolved environment in full. Every AKMS-family package
        # is a PyPI wheel, so no git credentials or git config are needed.
        run: uv sync --package logic-loom-api --all-extras
      - name: Sync curated AKMS Claude assets into resources/
        # The Claude-assets manager uses
        # `importlib.resources.files("logic_loom_api.resources.akms_claude")`
        # to locate bundled assets. The resources/akms_claude/ tree is
        # gitignored at dev time and populated by sync_akms_claude_assets.py
        # at build time (the sidecar build scripts run it).
        # CI pytest needs it too — without this step, the Claude-assets tests fail with
        # `ModuleNotFoundError: No module named 'logic_loom_api.resources.akms_claude'`.
        run: uv run python scripts/sync_akms_claude_assets.py
      - name: Run backend pytest suite
        run: uv run pytest services/logic_loom_api/tests -q
      - name: Run AKMS bundle migration + e2e suite
        run: uv run pytest services/logic_loom_api/tests/akms/test_migration_import_preview.py services/logic_loom_api/tests/akms/test_akms_bundle_e2e.py -v

  frontend-e2e:
    name: Frontend E2E (${{ matrix.os }})
    needs: resources-guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (declared in package.json packageManager) requires
          # Node >= 22.13 — it imports the `node:sqlite` builtin which
          # only exists on 22+. Node 20 was the original setting per
          # CLAUDE.md's `Node >=20` but pnpm 11 forces the bump.
          node-version: "22"
      - uses: pnpm/action-setup@v4
        # Version comes from package.json's `packageManager` field
        # (currently `pnpm@11.0.0`). Declaring `version:` here too causes
        # action-setup@v4 to error with `ERR_PNPM_BAD_PM_VERSION`.
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run vitest
        run: pnpm --filter logic-loom-desktop test
      - name: Run AKMS-bundle e2e spec
        run: pnpm --filter logic-loom-desktop test -- tests/e2e/akms_bundle.spec.tsx
