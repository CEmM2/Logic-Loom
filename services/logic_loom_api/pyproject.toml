[project]
name = "logic-loom-api"
version = "0.3.1"
description = "Façade FastAPI service for Logic-Loom: mounts AKMS batch picker, wraps zsum CLI, serves vault."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.30,<0.40",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sse-starlette>=2.1,<3.0",
    "anyio>=4.4,<5.0",
    "python-frontmatter>=1.1,<2.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0,<2.0",
    "ruamel.yaml>=0.18,<1.0",
    "zotero-summarizer>=1.0,<2",
]

[project.scripts]
logic-loom-api = "logic_loom_api.__main__:main"

[project.optional-dependencies]
# Every AKMS-family dependency comes from the published `akms` distribution and
# its own extras; Logic-Loom does not restate transitive packages (the package
# that owns a contract owns its dependency list).
#
# `akms` = the AKMS-gated tabs (Picker, Nodes, Graph, Batches) plus Learn:
#   - `akms[learn]`     -> akms-learn (nbformat/jinja2 are base deps there; it
#                          has no `notebook`/`html`/`llm` extras any more).
#   - `akms[nodes-gen]` -> akms-nodes-gen (batch picker, node generation).
#   - `akms-nodes-gen[llm]` -> litellm, the LiteLLM lane node-gen uses via
#                          host_llm. Deliberately NOT `akms[all]`: that would add
#                          the agent SDKs, MCP and OpenTelemetry stacks.
akms = [
    "akms[learn,nodes-gen]>=0.4.0,<0.5",
    "akms-nodes-gen[llm]>=0.4.0,<0.5",
]
# Computational-mechanics executable bridge. The router mount in main.py is
# try/except so the frozen core sidecar builds and runs WITHOUT this extra.
#
# `akms[compmech]` -> compmech-reference-pack[mechdsl] -> mechdsl-core + algo2code
# (the LaTeX->FEM *emit* and algorithm-transpile surface). Taichi does NOT come
# along: it lives in mechdsl-core's optional `[verify]` extra, which is never
# requested, so the ~170 MB runtime stays out of the sidecar. `verify` is gated
# off. opt-einsum (the compile-time contraction optimizer) is a base dep of
# mechdsl-core and rides along — intended.
mechdsl = [
    "akms[compmech]>=0.4.0,<0.5",
]
# Failure-memory product integration. INDEPENDENTLY selectable and deliberately
# NOT part of the core install nor of the `akms` extra above: not every
# Logic-Loom user keeps project failure registries, and the sidecar must stay
# fully usable without it. `routes/failure_memory.py` is mounted unconditionally;
# every handler probes `akms_failure_memory` at request time and emits the frozen
# consumer-contract degradation envelope when it is absent (see
# adapters/failure_memory.py).
#
# `akms[failure-memory]` installs `akms` (whose public API,
# `akms.task_context.resolve` and `akms.graph.build_graph`, the adapter uses) and
# `akms-failure-memory` at the same published version. See the re-pin note in
# services/logic_loom_api/tests/test_failure_memory_conformance.py.
failure-memory = [
    "akms[failure-memory]>=0.4.0,<0.5",
]
# akms-records (EXPERIMENTAL upstream). A schema-driven record store that is
# deliberately NOT part of any `akms` extra upstream and does not need `akms`
# itself. Logic-Loom only READS stores (browse records, schemas and the record
# graph); every handler probes `akms_records` at request time and
# `/api/records/status` reports it missing, so the sidecar runs without it.
records = [
    "akms-records>=0.4.0,<0.5",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logic_loom_api"]
# `templates/` and `resources/` live inside the package dir, so the default
# package file-selection would add them AND the force-include rules below would
# add them again -> hatchling aborts with "A second file is being added to the
# wheel archive at the same path". Exclude them from the normal selection so the
# force-include below is their SOLE source (force-include also pulls in the
# gitignored `resources/akms_claude/` tree materialised by
# scripts/sync_akms_claude_assets.py, which the package glob can't see).
exclude = [
    "src/logic_loom_api/templates",
    "src/logic_loom_api/resources",
]

[tool.hatch.build.targets.wheel.force-include]
"src/logic_loom_api/templates" = "logic_loom_api/templates"
"src/logic_loom_api/resources" = "logic_loom_api/resources"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# importlib import mode imports each test file under a path-derived module
# name, so the feature subdirectories under tests/ (learn/, akms/, host_llm/,
# ...) need no __init__.py and a basename shared across two of them cannot
# break collection. Keep basenames unique anyway; the mode is the safety net.
addopts = "--import-mode=importlib"
markers = [
    "unit: unit-tier tests (pure functions, no I/O)",
    "integration: integration-tier tests (cross-module wiring + FastAPI TestClient)",
    "regression: regression-tier tests (whole-flow e2e checks)",
]
